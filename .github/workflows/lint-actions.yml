name: lint-actions

# Static analysis of the workflows themselves: zizmor checks the security
# invariants (every action pinned to a full commit SHA, least-privilege
# permissions, no template injection); actionlint checks workflow syntax,
# `${{ }}` expressions and the shell in `run:` blocks. Runs whenever anything
# under .github changes.
on:
  pull_request:
    paths:
      - .github/**
  push:
    branches: [main]
    paths:
      - .github/**

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: zizmor
        env:
          # Lets zizmor resolve action refs; github.token is read-only here.
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor@1.26.1 --persona=regular .github/workflows

  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        env:
          # Pin the linter version; bump alongside zizmor when a new release lands.
          ACTIONLINT_VERSION: "1.7.12"
        # The download script is fetched at the matching version tag, so both
        # script and binary are pinned. shellcheck ships on the runner.
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash" \
            -o download-actionlint.bash
          bash download-actionlint.bash "$ACTIONLINT_VERSION"
          ./actionlint -color
